<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Veta Studios</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #F5F5F5;
            --accent-color: #E63946;
            --border-color: #2B2D42;
            --card-bg: #0A0A0C;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .clientes-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cliente-card {
            background-color: var(--card-bg);
            border-left: 4px solid #e53935;
            padding: 20px;
            border-radius: 8px;
        }

        .cliente-card h4 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .cliente-card p {
            margin: 0;
            color: #A0A0A0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="clientes-container">
        <div class="cliente-card">
            <h4>Empresa A</h4>
            <p>Desarrollador de software a medida.</p>
        </div>
        <div class="cliente-card">
            <h4>Empresa B</h4>
            <p>Consultoría en tecnología de la información.</p>
        </div>
        <div class="cliente-card">
            <h4>Empresa C</h4>
            <p>Proveedores de soluciones de marketing digital.</p>
        </div>
    </div>

</body>
</html>
