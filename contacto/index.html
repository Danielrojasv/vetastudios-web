<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Veta Studios</title>
    <meta name="description" content="Ponte en contacto con Veta Studios. Estamos listos para ayudarte a construir tu próximo producto digital.">
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        :root {
            --color-bg: #000000;
            --color-surface: #0A0A0C;
            --color-accent: #E63946;
            --color-text: #F5F5F5;
            --color-text-muted: #A0A0A0;
            --color-border: #2B2D42;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        .hero {
            margin-bottom: 60px;
        }

        .hero h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 20px 0;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--color-text-muted);
            max-width: 650px;
        }

        .contact-form {
            background-color: var(--color-surface);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--color-text);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 4px;
            color: var(--color-text);
            font-family: var(--font-primary);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e53935;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: var(--font-primary);
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        nav {
            display: flex;
            gap: 20px;
            margin-left: auto;
        }

        nav a {
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: var(--color-accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="site-header">
            <img src="/logo-veta-blanco.png" alt="Logo de Veta Studios" class="logo-img">
            <h1>Veta Studios</h1>
            <nav>
                <a href="/">Inicio</a>
                <a href="/contacto" class="active">Contacto</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <h2>Hablemos.</h2>
                <p>contacto@vetastudios.io</p>
            </section>

            <form class="contact-form" action="https://formspree.io/f/PLACEHOLDER" method="POST">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Enviar</button>
            </form>
        </main>
    </div>

    <footer class="site-footer">
        <div>&copy; 2026 Veta Studios. Todos los derechos reservados.</div>
        <div>
            <a href="/politicas-de-privacidad">Políticas de Privacidad</a> | 
            <a href="mailto:contacto@vetastudios.io">Contacto</a>
        </div>
    </footer>

</body>
</html>
