<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje enviado | Veta Studios</title>
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        .thanks-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            padding: 80px 0;
        }

        .thanks-icon {
            width: 48px;
            height: 48px;
            color: var(--color-accent);
        }

        .thanks-section h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 0;
        }

        .thanks-section p {
            font-size: 1rem;
            color: var(--color-text-muted);
            margin: 0;
            max-width: 500px;
            line-height: 1.7;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--color-text-muted);
            text-decoration: none;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 2px;
            transition: color 0.2s, border-color 0.2s;
        }

        .back-link:hover {
            color: var(--color-text);
            border-color: var(--color-text);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo-link">
                <img src="/logo-veta-blanco.png" alt="Logo de Veta Studios" class="logo-img">
                <span class="logo-name">Veta Studios</span>
            </a>
            <nav class="main-nav">
                <a href="/servicios">Servicios</a>
                <a href="/proyectos">Proyectos</a>
                <a href="/contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="thanks-section">
                <svg class="thanks-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <h1>Mensaje <span class="accent">recibido.</span></h1>
                <p>Gracias por escribirnos. Revisamos todos los mensajes y te responderemos en menos de 48 horas hábiles.</p>
                <a href="/" class="back-link">← Volver al inicio</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; 2026 Veta Studios. Todos los derechos reservados.</p>
            <p>
                <a href="/politicas-de-privacidad">Políticas de Privacidad</a> &nbsp;·&nbsp;
                <a href="mailto:contacto@vetastudios.io">contacto@vetastudios.io</a>
            </p>
        </div>
    </footer>

    <script>
        document.querySelectorAll('.main-nav a').forEach(function(link) {
            if (window.location.pathname.startsWith(link.getAttribute('href'))) {
                link.classList.add('active');
            }
        });
    </script>

</body>
</html>
